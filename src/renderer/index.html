<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/general_ui.css">
    <script src="js/turntodebug.js"></script>
    <title>TouchFish UI Remake 2</title>
    <style>
        body {
            background: #0078d7 url('assets/images/default_bg.jpg') center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #yrj {
            width: 250px;
            padding: 12px;
            text-align: center;
        }

        /* 引导弹窗样式 */
        #guide-modal {
            width: 450px;
            padding: 40px;
            position: relative;
            text-align: center;
            display: none;
            z-index: 100;
        }

        .skip-text-all {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 12px;
            color: #555;
            cursor: pointer;
            text-decoration: none;
        }

        .skip-text:hover {
            color: var(--tfur-blue);
        }

        /* 登录卡片样式 */
        #login-card {
            width: 350px;
            padding: 35px;
            display: none;
            /* 初始隐藏 */
        }

        .input-group {
            width: 100%;
            margin-bottom: 12px;
        }

        .tfur-step-page {
            display: none;
            flex-direction: column;
            animation: tfur-page-slide 0.4s ease-out;
        }

        .tfur-step-page.active {
            display: flex;
        }

        @keyframes tfur-page-slide {
            from {
                opacity: 0;
                transform: translateX(15px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .tfur-subtitle {
            font-size: 14px;
            color: #444;
            margin-bottom: 20px;
        }

        .tfur-btn-next {
            min-width: 100px;
            align-self: flex-end;
            margin-top: 10px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 13px;
            color: #0067b8;
            cursor: pointer;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        h2 {
            font-weight: 300;
            margin-bottom: 10px;
        }
    </style>
</head>

<body data-page="index">
    <div id="guide-modal" class="acrylic">
        <span class="skip-text-all"><span class="skip-text"
                id="guide-skip-once">跳过</span>&nbsp;&nbsp;<span class="skip-text"
                id="guide-skip-forever">不再显示</span></span>
        <h2 style="font-weight: 300;">欢迎使用 TouchFish UI Remake 2</h2>
        <p style="font-size: 14px; color: #333; margin-bottom: 30px; line-height: 1.6;">
            你已开启摸鱼之旅 <span id="use-count" style="font-weight: 600;">1</span> 次。<br>
            建议初次使用之前先查看使用介绍<br>
            以后你也可以在设置中跳转到引导界面<br>
            本界面在使用 5 次后将不再显示。
        </p>
        <button class="tfur-button primary" style="width: 100%; height: 45px;" id="guide-view-intro-btn">
            查看使用介绍
        </button>
    </div>

    <div id="yrj" class="acrylic" style="display: none;">
        <p>今天是 <span id="yrj-year">3000</span> 年 4 月 1 日</p>
        <br>
        <button id="yrj-clickme">点击我</button>
        <br>
        <a id="yrj-exit"></a>
    </div>

    <div id="login-card" class="acrylic">
        <div id="login-step-1" class="tfur-step-page active">
            <h2>登录</h2>
            <p class="tfur-subtitle">请输入服务器连接信息</p>
            <input type="text" class="input-group tfur-input" id="server-ip" placeholder="服务器 IP">
            <input type="number" class="input-group tfur-input" id="server-api-port" placeholder="API 端口"
                inputmode="numeric">
            <input type="number" class="input-group tfur-input" id="server-tcp-port" placeholder="TCP 端口"
                inputmode="numeric">
            <div style="margin-top: auto; display: flex; justify-content: flex-end;">
                <button id="login-next-btn" class="tfur-button primary tfur-btn-next">下一步</button>
            </div>
        </div>

        <div id="login-step-2" class="tfur-step-page">
            <div style="display: flex; align-items: center; margin-bottom: 5px;">
                <span class="back-link" id="login-back-btn" style="margin-top:0; margin-right: 8px;">⬅</span>
                <span id="login-display-server" style="font-size: 13px; color: #666;"></span>
            </div>
            <h2>登录账号</h2>
            <input type="text" class="input-group tfur-input" id="username" placeholder="用户名/UID">
            <input type="password" class="input-group tfur-input" id="password" placeholder="密码">
            <label>
                <button id="remember-password-btn">记住密码</button>
            </label>
            <button id="login-btn" class="tfur-button primary" style="width: 100%; margin-top: 10px;">登录</button>
        </div>

        <div style="text-align: center;">
            <span id="go-reg-btn" class="back-link">注册新账户</span>
        </div>
    </div>

    <script type="module" src="renderer.js"></script>
</body>

</html>
